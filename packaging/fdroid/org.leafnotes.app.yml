# Draft metadata for F-Droid (submit to https://gitlab.com/fdroid/fdroiddata as metadata/org.leafnotes.app.yml).
# F-Droid builds from source with its own signing key; the build below needs Rust, the NDK and cargo-apk.
Categories: [Writing, Science & Education]
License: GPL-3.0-only
AuthorName: Nils Briggen
WebSite: https://leafnotes.briggen.dev
SourceCode: https://github.com/NilsBriggen/leaf-notes
IssueTracker: https://github.com/NilsBriggen/leaf-notes/issues
AutoName: Leaf Notes
RepoType: git
Repo: https://github.com/NilsBriggen/leaf-notes.git
Builds:
  - versionName: 0.3.1
    versionCode: 7
    commit: v0.3.1-beta
    sudo:
      - apt-get update && apt-get install -y openjdk-17-jdk-headless zip
    output: target/release/apk/LeafNotes.apk
    srclibs: [rustup@1.27.1]
    ndk: r27b
    build:
      - $$rustup$$/rustup-init.sh -y --default-toolchain stable --target aarch64-linux-android
      - source $HOME/.cargo/env && cargo install cargo-apk --locked
      - source $HOME/.cargo/env && cargo apk build --release --lib && sh tools/android-java.sh target/release/apk/LeafNotes.apk
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.3.1
CurrentVersionCode: 7
