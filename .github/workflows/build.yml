name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Google Drive sign-in (Settings ▸ Secrets and variables ▸ Actions); without it the Drive option says it isn't set up
  LEAFNOTES_GOOGLE_SECRET: ${{ secrets.LEAFNOTES_GOOGLE_SECRET }}

jobs:
  appimage:
    # older Ubuntu = older glibc, so the AppImage runs on more Linux distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version for file names
        shell: bash
        # a release tag gives its version (v0.2.0-beta → 0.2.0-beta); other builds: Cargo.toml version + commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo test --release
      - run: cargo build --release
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wget -q -O /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy
          /tmp/linuxdeploy --appdir AppDir -e target/release/leafnotes -d packaging/leafnotes.desktop -i packaging/leafnotes.png --output appimage
          mv ./*.AppImage "LeafNotes-${{ env.VERSION }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: LeafNotes-linux
          path: LeafNotes-${{ env.VERSION }}-x86_64.AppImage

  msi:
    # windows-2022 comes with the WiX 3 toolset that cargo-wix uses
    runs-on: windows-2022
    env:
      # code signing happens only when a certificate is set up (secrets WINDOWS_CERT_PFX_B64 and WINDOWS_CERT_PASSWORD)
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version for file names
        shell: bash
        # a release tag gives its version (v0.2.0-beta → 0.2.0-beta); other builds: Cargo.toml version + commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-wix --locked
      - run: cargo build --release
      - name: Sign the program
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\leafnotes.exe
      - run: cargo wix init --force
      - run: cargo wix --no-build --nocapture --output target/wix/LeafNotes-${{ env.VERSION }}-x86_64.msi
      - name: Sign the installer
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\wix\LeafNotes-${{ env.VERSION }}-x86_64.msi
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: LeafNotes-windows
          path: target/wix/LeafNotes-${{ env.VERSION }}-x86_64.msi

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version for file names
        shell: bash
        # a release tag gives its version (v0.2.0-beta → 0.2.0-beta); other builds: Cargo.toml version + commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces (same versions as local builds)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - run: cargo install cargo-apk --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/dev.keystore
          else
            keytool -genkeypair -keystore android/dev.keystore -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Leaf Notes CI"
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK is signed with a throwaway key, so it can't update an installed copy."
          fi
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.1.12297006"
          cargo apk build --release --lib
          # the Java part (file picker, sharing, key store); the app can't start without it
          sh tools/android-java.sh target/release/apk/LeafNotes.apk
          cp target/release/apk/LeafNotes.apk "LeafNotes-${{ env.VERSION }}-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LeafNotes-android
          path: LeafNotes-${{ env.VERSION }}-arm64.apk

  release:
    # tag a version (git tag v0.1.0 && git push --tags) to publish the three files as a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, msi, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release description from CHANGELOG.md
        # v0.3.0-beta → the "## 0.3.0 …" section; the build fails if it's missing, so no release goes out without one
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          awk -v v="$V" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section for $V"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          # v0.1.0-beta and similar are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          overwrite_files: true
