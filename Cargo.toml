[package]
name = "leafnotes"
version = "0.2.2"
edition = "2021"
description = "Notes with pen, maths, recordings and flashcards"
authors = ["Nils Briggen"]
license = "GPL-3.0-only"
homepage = "https://leafnotes.briggen.dev"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "leafnotes"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
hayro = "0.9"
cpal = "0.18"
lopdf = { version = "0.47", default-features = false }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
sha2 = "0.11"
getrandom = "0.3"
ring = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11", "clipboard"] }
rfd = "0.17"
# passwords and sign-ins in Windows Credential Manager / the Secret Service (GNOME Keyring, KWallet) / macOS Keychain
keyring = { version = "3.6", features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# the system language ("Same as system")
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
ndk-context = "0.1"

[package.metadata.android]
package = "org.leafnotes.app"
apk_name = "LeafNotes"
resources = "android/res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.application]
has_code = true
label = "Leaf Notes"
icon = "@mipmap/ic_launcher"
# no title bar: the app draws its own top bar, and an invisible title bar would only push it down
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# Android must never restart the screen (the native side hangs on that): rotation, dark mode, language and size changes are handled in place
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale|locale|layoutDirection"
orientation = "unspecified"
# a small Java subclass (android/java, added by tools/android-java.sh) for the file picker,
# sharing into the app, opening attachments and the key store
name = "org.leafnotes.app.LeafActivity"
launch_mode = "singleTask"
exported = true

# "Share to Leaf Notes" from other apps
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "image/*" }, { mime_type = "application/pdf" }, { mime_type = "text/*" }]

# keep the launcher entry (cargo-apk adds it only when no filter is given)
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[profile.release]
opt-level = 2

# Development signing key (made locally). Replace with your own key before publishing to a store.
[package.metadata.android.signing.release]
path = "android/dev.keystore"
keystore_password = "android"

# The offline handwriting recognizer does real number crunching; keep it quick even in debug builds.
[profile.dev.package.leafnotes]
opt-level = 2

# Libraries (PDF rendering, UI) run optimized even in debug builds; printing a PDF stays quick.
[profile.dev.package."*"]
opt-level = 2

# winit with one change for Android: a finger touch carries no pressure, only a stylus does
# (see vendor/winit/src/platform_impl/android/mod.rs, "Leaf Notes"). Remove once winit reports the tool type.
[patch.crates-io]
winit = { path = "vendor/winit" }
